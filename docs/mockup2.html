<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>mockup-t4 v0.2</title>
  <style>
    body { font-family: monospace; font-size: 12px; margin: 20px; background: #fff; }
    .page-title { font-size: 1.4em; font-weight: bold; margin-bottom: 4px; }
    .panels-row { display: flex; gap: 8px; align-items: flex-start; margin-bottom: 8px; }
    .panel { border: 1px solid #aaa; padding: 6px; display: flex; gap: 4px; align-items: flex-start; }
    .panel-params { min-width: 60px; color: #333; white-space: pre; line-height: 1.8; }
    .panel-buttons { display: flex; flex-direction: column; gap: 3px; }
    .panel-buttons button {
      font-family: monospace; font-size: 11px;
      padding: 2px 8px; border: 1px solid #888;
      background: #f0f0f0; cursor: pointer; white-space: nowrap;
    }
    .panel-buttons button:disabled {
      color: #aaa; border-color: #ccc; background: #f8f8f8; cursor: default;
    }
    .panel-buttons button:hover:not(:disabled) { background: #ddd; }
    .panel-buttons-h { display: flex; flex-direction: row; gap: 3px; margin-bottom: 4px; }
    .panel-buttons-h button {
      font-family: monospace; font-size: 11px;
      padding: 2px 8px; border: 1px solid #888;
      background: #f0f0f0; cursor: pointer;
    }
    .panel-buttons-h button:disabled {
      color: #aaa; border-color: #ccc; background: #f8f8f8; cursor: default;
    }
    .panel-buttons-h button:hover:not(:disabled) { background: #ddd; }
    textarea {
      font-family: monospace; font-size: 11px;
      border: 1px solid #aaa; resize: none; padding: 2px;
    }
    canvas { border: 1px solid #aaa; display: block; }
    .color-list { white-space: pre; line-height: 1.8; min-width: 80px; }
    .wipe-row { display: flex; gap: 4px; align-items: center; margin: 4px 0; }
    .wipe-row button {
      font-family: monospace; font-size: 11px;
      padding: 2px 8px; border: 1px solid #888;
      background: #f0f0f0; cursor: pointer;
    }
    .wipe-box {
      width: 50px; height: 20px;
      border: 1px solid #aaa; background: #fff;
      display: inline-block;
    }
    .panel4 { border: 1px solid #aaa; padding: 6px; display: flex; flex-direction: column; gap: 4px; }
    .panel4-top { display: flex; gap: 4px; align-items: flex-start; }

    /* Progress bar styles */
    .progress-container {
      display: flex;
      flex-direction: column;
      gap: 3px;
      justify-content: center;
    }
    .progress-bar-wrap {
      width: 180px;
      height: 16px;
      border: 1px solid #aaa;
      background: #fff;
      overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%;
      width: 0%;
      background: #4488ff;
      transition: none;
    }
  </style>
</head>
<body>

<div class="page-title">mockup-t4 v0.2</div>
<p style="margin-top:0; margin-bottom:12px;">It is an illustration of chaining panels.</p>

<!-- ROW 1: Panel 1 + Panel 2 + Panel 5 -->
<div class="panels-row">

  <!-- PANEL 1 -->
  <div class="panel">
    <div class="panel-params" id="params1"></div>
    <div class="panel-buttons">
      <button onclick="wipe1()">wipe-1</button>
      <button onclick="data1()">data-1</button>
      <button id="btn-read1" onclick="read1()" disabled>read-1</button>
      <button id="btn-exec1" onclick="exec1()" disabled>exec-1</button>
    </div>
    <textarea id="txa1" rows="11" cols="28" readonly></textarea>
  </div>

  <!-- PANEL 2 -->
  <div class="panel">
    <div class="color-list" id="params2"></div>
    <div class="panel-buttons">
      <button onclick="wipe2()">wipe-2</button>
      <button id="btn-data2" onclick="data2()" disabled>data-2</button>
      <button id="btn-read2" onclick="read2()" disabled>read-2</button>
      <button id="btn-exec2" onclick="exec2()" disabled>exec-2</button>
    </div>
    <canvas id="canvas2" width="160" height="176"></canvas>
  </div>

  <!-- PANEL 5 -->
  <div class="panel">
    <div class="panel-buttons">
      <button id="btn-scan"   onclick="p5run('scan',   'bar1')">scan</button>
      <button id="btn-filter" onclick="p5run('filter', 'bar2')">filter</button>
      <button id="btn-format" onclick="p5run('format', 'bar3')">format</button>
      <button id="btn-sort"   onclick="p5run('sort',   'bar4')">sort</button>
      <button id="btn-erase"  onclick="p5run('erase',  'bar5')">erase</button>
    </div>
    <div class="progress-container">
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar1"></div></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar2"></div></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar3"></div></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar4"></div></div>
      <div class="progress-bar-wrap"><div class="progress-bar-fill" id="bar5"></div></div>
    </div>
  </div>

</div>

<!-- WIPE ROW -->
<div class="wipe-row">
  <button onclick="wipeAll()">wipe</button>
  <span class="wipe-box"></span>
  <span class="wipe-box"></span>
  <span class="wipe-box"></span>
  <span class="wipe-box"></span>
  <span class="wipe-box"></span>
</div>

<!-- ROW 2: Panel 3 -->
<div class="panels-row">
  <div class="panel">
    <div class="panel-params" id="params3"></div>
    <div class="panel-buttons">
      <button onclick="wipe3()">wipe-3</button>
      <button id="btn-data3" onclick="data3()" disabled>data-3</button>
      <button id="btn-read3" onclick="read3()" disabled>read-3</button>
      <button id="btn-exec3" onclick="exec3()" disabled>exec-3</button>
    </div>
    <canvas id="canvas3" width="160" height="176"></canvas>
  </div>
</div>

<!-- PANEL 4 -->
<div class="panel4">
  <div class="panel4-top">
    <div class="panel-params" id="params4"></div>
    <textarea id="txa4" rows="8" cols="40" readonly></textarea>
  </div>
  <div class="panel-buttons-h">
    <button onclick="wipe4()">wipe</button>
    <button onclick="data4()">data</button>
    <button id="btn-read4" onclick="read4()" disabled>read</button>
    <button id="btn-exec4" onclick="exec4()" disabled>exec</button>
    <button onclick="none4()">none</button>
    <button onclick="info4()">info</button>
  </div>
  <canvas id="canvas4" width="300" height="120"></canvas>
</div>

<script>
  const COLS = 9, ROWS = 11, UMIN = 0.20, UMAX = 0.70, UNUM = 11;

  const params1Text =
`COLS 9
ROWS 11
UMIN 0.20
UMAX 0.70
UNUM 11
SEPC ;`;

  const params2Text =
`CNUM 11
CL00 #522
CL01 #622
CL02 #722
CL03 #822
CL04 #922
CL05 #a22
CL06 #022
CL07 #c22
CL08 #d22
CL09 #e22
CL10 #f22`;

  const params3Text =
`XMIN 0
YMIN 0
XMAX 9
YMAX 11`;

  const params4Text =
`# palette
NUMC 10
COL0 #888
COL1 #f22
COL2 #f33
COL3 #f44
COL4 #f55
COL5 #f66
COL6 #f77
COL7 #f88
COL8 #f99
COL9 #faa`;

  const outputData =
`.40;.45;.45;.20;.35;.60;.35;.30;.20
.30;.55;.45;.40;.35;.35;.25;.25;.60
.20;.70;.45;.30;.40;.30;.45;.25;.70
.40;.50;.20;.60;.25;.50;.25;.50;.45
.35;.35;.50;.35;.60;.20;.20;.25;.60
.35;.35;.50;.35;.60;.20;.20;.25;.60
.40;.45;.20;.20;.20;.65;.35;.70;.65
.25;.30;.60;.65;.30;.20;.45;.25;.60
.55;.60;.40;.35;.30;.65;.25;.65;.25
.40;.70;.20;.40;.60;.65;.65;.70;.50
.20;.60;.70;.55;.70;.20;.40;.65;.40`;

  const grid4Rows = 20, grid4Cols = 30;
  const grid4Data = (() => {
    let rows = [];
    for (let r = 0; r < grid4Rows; r++) {
      let row = [];
      for (let c = 0; c < grid4Cols; c++) {
        const threshold = 10 + Math.round(4 * Math.sin(c * 0.4));
        row.push(r > threshold ? 1 : 0);
      }
      rows.push(row);
    }
    return rows;
  })();
  const grid4Text = grid4Data.map(r => r.join(";")).join("\n");

  const colors2 = [
    "#552222","#662222","#772222","#882222","#992222",
    "#aa2222","#002222","#cc2222","#dd2222","#ee2222","#ff2222"
  ];
  const colors4 = ["#888888","#ff2222"];

  let grid = [];

  function en(id, val) { document.getElementById(id).disabled = !val; }
  function setText(id, text) { document.getElementById(id).textContent = text; }

  // ---- PANEL 1 ----
  function wipe1() {
    setText("params1",""); setText("params2",""); setText("params3","");
    document.getElementById("txa1").value = "";
    clearCanvas("canvas2"); clearCanvas("canvas3");
    grid = [];
    en("btn-read1",false); en("btn-exec1",false);
    en("btn-data2",false); en("btn-read2",false); en("btn-exec2",false);
    en("btn-data3",false); en("btn-read3",false); en("btn-exec3",false);
  }

  function data1() { setText("params1", params1Text); en("btn-read1", true); }

  function read1() {
    const lines = outputData.trim().split("\n");
    grid = [];
    for (let r = 0; r < ROWS; r++) {
      const vals = lines[r] ? lines[r].split(";") : [];
      let row = [];
      for (let c = 0; c < COLS; c++) {
        const v = parseFloat(vals[c]);
        row.push(isNaN(v) ? UMIN : v);
      }
      grid.push(row);
    }
    en("btn-exec1", true);
    en("btn-data2", true);
    en("btn-data3", true);
  }

  function exec1() { document.getElementById("txa1").value = outputData; }

  // ---- PANEL 2 ----
  function wipe2() { setText("params2",""); clearCanvas("canvas2"); en("btn-read2",false); en("btn-exec2",false); }
  function data2() { setText("params2", params2Text); en("btn-read2", true); }
  function read2() { en("btn-exec2", true); }
  function exec2() { drawHeatmap("canvas2"); }

  // ---- PANEL 3 ----
  function wipe3() { setText("params3",""); clearCanvas("canvas3"); en("btn-read3",false); en("btn-exec3",false); }
  function data3() { setText("params3", params3Text); en("btn-read3", true); }
  function read3() { en("btn-exec3", true); }
  function exec3() { drawHeatmap("canvas3"); }

  // ---- PANEL 4 ----
  function wipe4() {
    setText("params4","");
    document.getElementById("txa4").value = "";
    clearCanvas("canvas4");
    en("btn-read4",false); en("btn-exec4",false);
  }
  function data4() { setText("params4", params4Text); document.getElementById("txa4").value = grid4Text; en("btn-read4", true); }
  function read4() { en("btn-exec4", true); }
  function exec4() { drawTerrain(); }
  function none4() { clearCanvas("canvas4"); }
  function info4() {
    document.getElementById("txa4").value =
      "ROWS: " + grid4Rows + "\nCOLS: " + grid4Cols;
  }

  // ---- PANEL 5 — progress bars ----
  function p5run(name, barId) {
    const btn = document.getElementById("btn-" + name);
    btn.disabled = true;  // disable immediately
    const bar = document.getElementById(barId);
    let pct = 0;
    const interval = setInterval(() => {
      pct += 2;
      bar.style.width = pct + "%";
      if (pct >= 100) {
        bar.style.width = "100%";
        clearInterval(interval);
        // button stays disabled permanently
      }
    }, 20);
  }

  // ---- WIPE ALL ----
  function wipeAll() { wipe1(); wipe2(); wipe3(); wipe4(); }

  // ---- HELPERS ----
  function clearCanvas(id) {
    const c = document.getElementById(id);
    c.getContext("2d").clearRect(0, 0, c.width, c.height);
  }

  function valToColorIdx(v) {
    let idx = Math.round((v - UMIN) / (UMAX - UMIN) * (UNUM - 1));
    return Math.max(0, Math.min(UNUM - 1, idx));
  }

  function drawHeatmap(canvasId) {
    const canvas = document.getElementById(canvasId);
    const ctx = canvas.getContext("2d");
    const cellW = 17, cellH = 16;
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < grid.length; r++) {
      for (let c = 0; c < grid[r].length; c++) {
        ctx.fillStyle = colors2[valToColorIdx(grid[r][c])];
        ctx.fillRect(c * cellW, r * cellH, cellW - 1, cellH - 1);
      }
    }
    ctx.fillStyle = "#00cc00";
    ctx.fillRect(3 * cellW, 2 * cellH, cellW - 1, cellH - 1);
    ctx.fillStyle = "#4444ff";
    ctx.fillRect(2 * cellW, 9 * cellH, cellW - 1, cellH - 1);
  }

  function drawTerrain() {
    const canvas = document.getElementById("canvas4");
    const ctx = canvas.getContext("2d");
    const cellW = Math.floor(canvas.width / grid4Cols);
    const cellH = Math.floor(canvas.height / grid4Rows);
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (let r = 0; r < grid4Rows; r++) {
      for (let c = 0; c < grid4Cols; c++) {
        ctx.fillStyle = grid4Data[r][c] === 1 ? colors4[1] : colors4[0];
        ctx.fillRect(c * cellW, r * cellH, cellW - 1, cellH - 1);
      }
    }
  }
</script>

</body>
</html>
